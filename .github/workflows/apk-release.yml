name: Android APK Release

# Builds the Capacitor Android app and publishes a signed APK to GitHub Releases on
# every push to main. The APK is always attached as `manchitra.apk`, so the stable
# URL .../releases/latest/download/manchitra.apk always serves the newest build.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Build & publish APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Check release signing secrets
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE" ]; then
            echo "::error::Secret ANDROID_KEYSTORE_BASE64 is not set. See the setup steps in the repository README."
            exit 1
          fi

      - name: Restore release keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p "$RUNNER_TEMP/keystore"
          echo "$KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/keystore/manchitra-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/keystore/manchitra-release.jks" >> "$GITHUB_ENV"

      - name: Build web app
        run: npm run build
        env:
          # The Android WebView is served from https://localhost, so it must be told
          # where the real API lives.
          VITE_API_BASE: ${{ vars.VITE_API_BASE }}
          VITE_GOOGLE_CLIENT_ID: ${{ vars.VITE_GOOGLE_CLIENT_ID }}
          VITE_APK_URL: https://github.com/${{ github.repository }}/releases/latest/download/manchitra.apk

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build signed APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --no-daemon

      - name: Collect APK
        id: collect
        run: |
          set -euo pipefail
          APK_PATH=$(find app/build/outputs/apk/release -name '*.apk' | head -n 1)
          if [ -z "$APK_PATH" ]; then
            echo "::error::No APK was produced by assembleRelease."
            exit 1
          fi
          cp "$APK_PATH" "$RUNNER_TEMP/manchitra.apk"
          ls -lh "$RUNNER_TEMP/manchitra.apk"
          echo "asset=$RUNNER_TEMP/manchitra.apk" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ASSET_PATH: ${{ steps.collect.outputs.asset }}
          TAG: apk-v${{ github.run_number }}
        run: |
          set -euo pipefail
          NOTES=$(node -e "process.stdout.write('Manchitra '+require('./package.json').version+' (build ${{ github.run_number }})')")
          # Replace the asset if this tag already exists, so re-runs stay idempotent.
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$ASSET_PATH" --clobber
          else
            gh release create "$TAG" "$ASSET_PATH" \
              --title "Manchitra ${{ github.run_number }}" \
              --notes "$NOTES" \
              --latest
          fi

      - name: Summary
        run: |
          {
            echo "### Android APK published"
            echo ""
            echo "- Tag: \`apk-v${{ github.run_number }}\`"
            echo "- Download: https://github.com/${{ github.repository }}/releases/latest/download/manchitra.apk"
          } >> "$GITHUB_STEP_SUMMARY"